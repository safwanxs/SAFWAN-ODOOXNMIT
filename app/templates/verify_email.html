{% extends "base.html" %}{% block content %}<div class="auth"><div class="card"><p class="eyebrow">Dayflow HRMS</p><h1>Email Verification</h1><p class="message" id="message">Verifying your email address…</p><p class="auth-switch" style="margin-top:20px"><a href="/login">Go to Sign in</a></p><script>async function verify(){const params=new URLSearchParams(location.search),token=params.get('token');if(!token){message.textContent='Invalid or missing verification token.';return}try{let r=await fetch('/auth/verify-email?token='+encodeURIComponent(token));let d=await r.json();message.textContent=r.ok?(d.message||'Email verified successfully.'):(d.detail||'Verification failed.')}catch(e){message.textContent='An error occurred during verification.'}}verify();</script></div></div>{% endblock %}
