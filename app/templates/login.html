{% extends "base.html" %}{% block content %}<div class="auth"><div class="card"><p class="eyebrow">Dayflow HRMS</p><h1>Sign in</h1><form id="form"><input name="identifier" placeholder="Email or Login ID" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button></form><p class="message" id="message"></p><p class="auth-switch">Setting up a new company? <a href="/">Sign up</a></p><script>function detailText(d){return Array.isArray(d.detail)?d.detail.map(x=>x.msg||JSON.stringify(x)).join('; '):(d.detail||'Something went wrong.')}document.querySelector('#form').onsubmit=async e=>{e.preventDefault();let r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))}),d=await r.json();if(!r.ok)return message.textContent=detailText(d);localStorage.token=d.access_token;location.href=d.must_change_password?'/change-password':'/employees'}</script></div></div>{% endblock %}
