<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Dayflow{% endblock %}</title><link rel="stylesheet" href="/static/css/dayflow.css">{% block extra_head %}{% endblock %}</head>
<body><div class="app-shell"><nav class="topbar"><a class="brand" href="/"><span class="brand-mark">D</span> Dayflow</a><div class="nav-links"><a href="/employees">People</a><a href="/attendance/view">Attendance</a><a href="/time-off">Time off</a><a href="/payroll">Payroll</a><a href="/dashboard">Analytics</a></div><div id="user-menu" style="position:relative"><a class="nav-login" href="/login">Sign in</a></div></nav><main class="page">{% block content %}{% endblock %}</main></div><script>(async()=>{const token=localStorage.token,container=document.getElementById("user-menu");if(!token||!container)return;try{const r=await fetch("/auth/me",{headers:{Authorization:"Bearer "+token}});if(!r.ok)return;const me=await r.json();container.innerHTML=`<button id="profileBtn" type="button" class="nav-login" style="display:flex;align-items:center;gap:8px;background:none;color:var(--text);border:1px solid var(--line);cursor:pointer;font-weight:600"><span style="width:24px;height:24px;border-radius:50%;background:var(--purple);display:grid;place-items:center;font-size:12px;color:#fff">${me.first_name[0]}</span><span>${me.first_name} ${me.last_name}</span> ▾</button><div id="profileDropdown" style="display:none;position:absolute;right:0;top:42px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px #00000050;min-width:160px;z-index:100;overflow:hidden"><a href="/profile/${me.id}" style="display:block;padding:10px 16px;color:var(--text);border-bottom:1px solid var(--line)">My Profile</a><a id="logoutBtn" style="display:block;padding:10px 16px;color:var(--red);cursor:pointer">Log Out</a></div>`;const btn=document.getElementById("profileBtn"),menu=document.getElementById("profileDropdown"),logout=document.getElementById("logoutBtn");btn.onclick=e=>{e.stopPropagation();menu.style.display=menu.style.display==="block"?"none":"block"};document.onclick=()=>menu.style.display="none";logout.onclick=()=>{localStorage.removeItem("token");location.href="/login"}}catch{}})();</script></body></html>
