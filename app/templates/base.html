<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Dayflow{% endblock %}</title><link rel="stylesheet" href="/static/css/dayflow.css">{% block extra_head %}{% endblock %}</head>
<body><div class="app-shell"><nav class="topbar"><a class="brand" href="/employees"><span class="brand-mark">D</span> Dayflow</a><div class="nav-links"><a href="/employees">People</a><a href="/attendance/view">Attendance</a><a href="/time-off">Time off</a><a href="/payroll">Payroll</a><a href="/dashboard">Analytics</a><a href="/about">About</a></div><a class="nav-login" href="/login">Sign in</a></nav><main class="page">{% block content %}{% endblock %}</main></div><script>(async()=>{const token=localStorage.token,link=document.querySelector(".nav-login");if(!token||!link)return;try{const r=await fetch("/auth/me",{headers:{Authorization:"Bearer "+token}});if(!r.ok)return;const me=await r.json();link.textContent=me.first_name+" · Log out";link.removeAttribute("href");link.style.cursor="pointer";link.onclick=()=>{localStorage.removeItem("token");location.href="/login"}}catch{}})();</script></body></html>
