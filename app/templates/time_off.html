<!doctype html>
<html><body>
<nav><a href="/employees">Employees</a> | <a href="/attendance/view">Attendance</a> | <a href="/time-off">Time Off</a> | <a href="/payroll">Payroll</a> | <a href="/dashboard">Dashboard</a></nav>
<h1>Time Off</h1><section id="summary"></section><section id="request-form"></section><section id="calendar"></section><table><thead><tr><th>Employee</th><th>Type</th><th>Start</th><th>End</th><th>Days</th><th>Status</th><th>Comment</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table>
<script>
const headers={'Authorization':'Bearer '+localStorage.token};let me;
async function api(url,options={}){let r=await fetch(url,{...options,headers:{...headers,...(options.headers||{})}});if(r.status===401||r.status===403){location='/login';throw Error('Not authorized')}return r}
function table(items,admin){rows.innerHTML=items.map(x=>`<tr><td>${x.employee_name||'You'}</td><td>${x.leave_type}</td><td>${x.start_date}</td><td>${x.end_date}</td><td>${x.days_requested}</td><td style="color:${x.status==='approved'?'green':x.status==='rejected'?'red':'orange'}">${x.status}</td><td>${x.admin_comment||''}</td><td>${admin&&x.status==='pending'?`<button onclick="review(${x.id},'approved')">Approve</button><button onclick="review(${x.id},'rejected')">Reject</button>`:''}</td></tr>`).join('')}
async function review(id,status){let admin_comment=prompt('Comment (optional)')||'';await api('/leave/requests/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,admin_comment})});load()}
async function load(){me=await (await api('/auth/me')).json();if(me.role==='admin'){summary.textContent='Review all employee leave requests.';requestForm.innerHTML='';table(await (await api('/leave/requests')).json(),true);calendar.innerHTML=''}else{let allocations=await (await api('/leave/allocations/me')).json();summary.innerHTML=allocations.map(x=>`<b>${x.leave_type}: ${String(x.days_available).padStart(2,'0')} Days Available</b> `).join('');requestForm.innerHTML=`<h2>Request leave</h2><form id="form"><select name="leave_type"><option value="paid_time_off">Paid Time Off</option><option value="sick_leave">Sick Leave</option><option value="unpaid_leave">Unpaid Leave</option></select><input name="start_date" type="date" required><input name="end_date" type="date" required><input name="remarks" placeholder="Remarks"><input name="attachment" type="file" accept=".pdf,.png,.jpg,.jpeg"><button>Request</button></form>`;form.onsubmit=async e=>{e.preventDefault();let f=new FormData(form),body={leave_type:f.get('leave_type'),start_date:f.get('start_date'),end_date:f.get('end_date'),remarks:f.get('remarks')};let r=await api('/leave/requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let request=await r.json();if(!r.ok)return alert(request.detail);if(f.get('attachment').size){let upload=new FormData();upload.append('attachment',f.get('attachment'));await api('/leave/requests/'+request.id+'/attachment',{method:'POST',body:upload})}load()};let requests=await (await api('/leave/requests/me')).json();table(requests,false);let year=new Date().getFullYear(),data=await (await api('/leave/calendar/me?year='+year)).json();calendar.innerHTML='<h2>'+year+' calendar</h2>'+data.requests.map(x=>`<span style="color:${x.status==='approved'?'green':x.status==='rejected'?'red':'orange'}">${x.start_date}–${x.end_date}: ${x.leave_type} (${x.status})</span><br>`).join('')+data.public_holidays.map(x=>`<span style="color:blue">${x.date}: ${x.name}</span><br>`).join('')}
load();
</script></body></html>
