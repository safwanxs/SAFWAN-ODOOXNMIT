{% extends "base.html" %}{% block content %}<div class="auth"><div class="card"><p class="eyebrow">Dayflow HRMS</p><h1>Sign Up — Set up your company</h1><form id="form"><input name="company_name" placeholder="Company name" required><input name="company_code" placeholder="Company code" required><input name="admin_first_name" placeholder="First name" required><input name="admin_last_name" placeholder="Last name" required><input name="admin_email" type="email" placeholder="Email" required><input name="admin_phone" placeholder="Phone"><input name="password" type="password" placeholder="Password" required><input name="confirm_password" type="password" placeholder="Confirm password" required><button>Create company &amp; Sign Up</button></form><p class="message" id="message"></p><p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p><script>document.querySelector('#form').onsubmit=async e=>{e.preventDefault();let r=await fetch('/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target))) });document.querySelector('#message').textContent=r.ok?'Company created. Sign in.':(await r.json()).detail}</script></div></div>{% endblock %}
