{% extends "base.html" %}{% block content %}<div class="auth"><div class="card"><p class="eyebrow">Dayflow HRMS</p><h1>Register Account</h1><form id="form"><input name="first_name" placeholder="First name" required><input name="last_name" placeholder="Last name" required><input name="email" type="email" placeholder="Work Email" required><input name="password" type="password" placeholder="Password (min 8 chars, 1 uppercase, 1 digit)" required><input name="confirm_password" type="password" placeholder="Confirm password" required><label style="color:var(--muted);font-size:13px">Requested Role: <select name="role"><option value="employee">Employee</option><option value="hr">HR Officer (Requires Admin Approval)</option></select></label><button>Register</button></form><p class="message" id="message"></p><p class="auth-switch">Already registered? <a href="/login">Sign in</a></p><script>function detailText(d){return Array.isArray(d.detail)?d.detail.map(x=>x.msg||JSON.stringify(x)).join('; '):(d.detail||'Something went wrong.')}document.querySelector('#form').onsubmit=async e=>{e.preventDefault();let r=await fetch('/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))}),d=await r.json();document.querySelector('#message').textContent=r.ok?(d.message||'Registered. Check your email or server logs to verify.'):detailText(d)}</script></div></div>{% endblock %}
