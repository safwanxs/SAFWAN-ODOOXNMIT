{% extends "base.html" %}{% block content %}
<h1>Attendance</h1><section id="controls"></section><section id="summary"></section><table><thead><tr><th>Date</th><th>Employee</th><th>Status</th><th>Check in</th><th>Check out</th><th>Work hours</th><th>Extra hours</th></tr></thead><tbody id="rows"></tbody></table>
<script>
const headers={'Authorization':'Bearer '+localStorage.token};let me,selected=new Date(),displayMode='date',searchTerm='';
async function api(url){let r=await fetch(url,{headers});if(r.status===401||r.status===403){location='/login';throw Error('Not authorized')}return r}
function iso(d){return d.toISOString().slice(0,10)} function cells(items){rows.innerHTML=items.map(x=>`<tr><td>${x.date}</td><td>${x.employee_name||'You'}</td><td>${x.status}</td><td>${x.check_in_time||'—'}</td><td>${x.check_out_time||'—'}</td><td>${x.work_hours}</td><td>${x.extra_hours}</td></tr>`).join('')}
async function load(){me=me||await (await api('/auth/me')).json();if(me.role==='admin'){controls.innerHTML=`<input id="search" value="${searchTerm}" placeholder="Search employees"><button id="prev">Previous day</button><b>${iso(selected)}</b><button id="next">Next day</button><button id="mode">View: ${displayMode}</button>`;let data=await (await api('/attendance?date='+iso(selected)+'&display_mode='+displayMode)).json();cells(data.attendance.filter(x=>x.employee_name.toLowerCase().includes(searchTerm.toLowerCase())));prev.onclick=()=>{selected.setDate(selected.getDate()-1);load()};next.onclick=()=>{selected.setDate(selected.getDate()+1);load()};mode.onclick=()=>{displayMode=displayMode==='date'?'day':'date';load()};search.oninput=e=>{searchTerm=e.target.value;load()}}else{let data=await (await api('/attendance/me?month='+(selected.getMonth()+1)+'&year='+selected.getFullYear())).json();controls.innerHTML=`<button id="prev">Previous month</button><b>${data.summary.month}/${data.summary.year}</b><button id="next">Next month</button>`;summary.textContent=`Days present: ${data.summary.days_present} | Leaves: ${data.summary.leaves_count} | Working days: ${data.summary.total_working_days}`;cells(data.attendance);prev.onclick=()=>{selected.setMonth(selected.getMonth()-1);load()};next.onclick=()=>{selected.setMonth(selected.getMonth()+1);load()}}
load();
</script>{% endblock %}
