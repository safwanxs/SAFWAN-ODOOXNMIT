<!doctype html><html><body><h1>Change password required</h1><form id="form"><input name="current_password" type="password" placeholder="Current password" required><input name="new_password" type="password" placeholder="New password" required><input name="confirm_new_password" type="password" placeholder="Confirm new password" required><button>Update password</button></form><p id="message"></p><script>document.querySelector('#form').onsubmit=async e=>{e.preventDefault();let r=await fetch('/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.token},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(r.ok)location.href='/employees';else message.textContent=(await r.json()).detail}</script></body></html>
