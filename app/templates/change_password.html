{% extends "base.html" %}{% block content %}<div class="auth"><div class="card"><p class="eyebrow">Dayflow HRMS</p><h1>Change password required</h1><form id="form"><input name="current_password" type="password" placeholder="Current password" required><input name="new_password" type="password" placeholder="New password" required><input name="confirm_new_password" type="password" placeholder="Confirm new password" required><button>Update password</button></form><p class="message" id="message"></p><script>function detailText(d){return Array.isArray(d.detail)?d.detail.map(x=>x.msg||JSON.stringify(x)).join('; '):(d.detail||'Something went wrong.')}document.querySelector('#form').onsubmit=async e=>{e.preventDefault();let r=await fetch('/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.token},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});let d=await r.json();if(r.ok)location.href='/employees';else message.textContent=detailText(d)}</script></div></div>{% endblock %}
