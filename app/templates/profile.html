{% extends "base.html" %}{% block content %}
<p class="eyebrow">Employee record</p><h1 id="name">Profile</h1>
<div id="tabs" class="controls"><button data-tab="resume">Resume</button><button data-tab="private">Private Info</button><button id="salary-tab" data-tab="salary" hidden>Salary Info</button><button data-tab="security">Security</button></div>
<section id="picture-panel" hidden><h2>Profile picture</h2><img id="picture-preview" src="https://placehold.co/96" width="96" height="96" alt="Profile picture preview"><p><input id="picture-input" type="file" accept="image/jpeg,image/png,image/webp"></p><p id="picture-status" class="message"></p></section>
<pre id="content"></pre><p id="actions"></p>
<script>
const userId={{ user_id }},headers={'Authorization':'Bearer '+localStorage.token};let me,profile;
const content=document.querySelector('#content'),actions=document.querySelector('#actions'),picturePanel=document.querySelector('#picture-panel'),picturePreview=document.querySelector('#picture-preview'),pictureInput=document.querySelector('#picture-input'),pictureStatus=document.querySelector('#picture-status');
function detailText(d){return Array.isArray(d.detail)?d.detail.map(x=>x.msg||JSON.stringify(x)).join('; '):(d.detail||'Something went wrong.')}
async function api(url,options={},redirectOnForbidden=true){let r=await fetch(url,{...options,headers:{...headers,...(options.headers||{})}});if(r.status===401||(r.status===403&&redirectOnForbidden)){location='/login';throw Error('Not authorized')}return r}
async function setup(){try{me=await (await api('/auth/me')).json();profile=await (await api('/api/profiles/'+userId)).json();document.querySelector('#name').textContent='Profile #'+userId;document.querySelector('#salary-tab').hidden=me.role!=='admin';show('resume')}catch(error){if(error.message!=='Not authorized')content.textContent='Unable to load profile: '+error.message}}
function canManagePicture(){return me.id===userId||me.role==='admin'}
function show(tab){const fields=tab==='resume'?['about','interests','skills','certifications']:tab==='private'?['phone','date_of_birth','address','nationality','personal_email','gender','marital_status','date_of_joining','bank_account_number','bank_name','ifsc','pan','uan']:[];picturePanel.hidden=tab!=='resume'||!canManagePicture();if(!picturePanel.hidden)picturePreview.src=profile.profile_picture_url||'https://placehold.co/96';if(tab==='security'){content.textContent='Use the change-password page to update your password.';actions.innerHTML='<a href="/change-password">Change password</a>';return}if(tab==='salary'){api('/api/profiles/'+userId+'/salary').then(async r=>content.textContent=r.ok?JSON.stringify(await r.json(),null,2):'No salary structure.').catch(error=>content.textContent='Unable to load salary: '+error.message);return}content.textContent=JSON.stringify(Object.fromEntries(fields.map(field=>[field,profile[field]])),null,2);actions.textContent=canManagePicture()?'You can update this profile picture from the Resume tab.':''}
document.querySelector('#tabs').onclick=e=>{if(e.target.dataset.tab)show(e.target.dataset.tab)};
pictureInput.onchange=async()=>{const file=pictureInput.files[0];if(!file)return;const form=new FormData();form.append('file',file);pictureStatus.textContent='Uploading picture…';try{const r=await api('/api/profiles/'+userId+'/picture',{method:'POST',body:form},false),data=await r.json();if(!r.ok){pictureStatus.textContent=detailText(data);return}profile=data;picturePreview.src=data.profile_picture_url+'?v='+Date.now();pictureStatus.textContent='Profile picture updated.'}catch(error){pictureStatus.textContent=error.message==='Not authorized'?'Please sign in again.':'Unable to upload picture: '+error.message}};
setup();
</script>{% endblock %}
