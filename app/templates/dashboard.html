{% extends "base.html" %}{% block extra_head %}<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>{% endblock %}{% block content %}<p class="eyebrow">Company pulse</p><h1>Analytics dashboard</h1><div id="state">Loading dashboard…</div><div id="cards" class="cards" hidden></div><canvas id="chart" hidden></canvas>
<script>
const headers={Authorization:'Bearer '+localStorage.token};function detailText(d){return Array.isArray(d.detail)?d.detail.map(x=>x.msg||JSON.stringify(x)).join('; '):(d.detail||'Something went wrong.')}
async function load(){try{const r=await fetch('/api/dashboard',{headers});if(!r.ok)throw new Error(detailText(await r.json()));const d=await r.json();state.hidden=true;cards.hidden=false;chart.hidden=false;cards.innerHTML=[['Headcount',d.headcount],['Checked in today',d.checked_in_today],['Attendance rate',d.attendance_rate+'%'],['Pending leave',d.pending_leave_requests],['Payroll ready',d.payroll_ready_count]].map(([k,v])=>`<article class="card"><small>${k}</small><strong>${v}</strong></article>`).join('');new Chart(chart,{type:'bar',data:{labels:['Checked in','Pending leave','Payroll ready'],datasets:[{label:'Employees',data:[d.checked_in_today,d.pending_leave_requests,d.payroll_ready_count],backgroundColor:['#36a2eb','#ffce56','#4bc0c0']}]},options:{responsive:true}})}catch(error){state.textContent='Unable to load dashboard: '+error.message}}load();
</script>{% endblock %}
